name: hovr_app_update
description: Native update dialog (store + Shorebird OTA) with once-per-session policy for HOVR Flutter apps.
version: 0.2.5
homepage: https://github.com/vishalsharma-hovr/hovr_app_update
repository: https://github.com/vishalsharma-hovr/hovr_app_update
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ridehovr.hovr_app_update
        pluginClass: HovrAppUpdatePlugin
      ios:
        pluginClass: HovrAppUpdatePlugin
